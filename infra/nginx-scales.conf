server {
    server_name dancingdragonservices.com www.dancingdragonservices.com;

    # Security: don't leak nginx version
    server_tokens off;

    # HSTS (1 year, include subdomains, preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Clickjacking protection
    add_header X-Frame-Options "SAMEORIGIN" always;

    # XSS protection
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (tune as needed)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss://dancingdragonservices.com https://dancingdragonservices.com; frame-ancestors 'self';" always;

    # Cache control for static chunks (immutable, 1 year)
    location /_next/static/ {
        proxy_pass http://localhost:4000;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent HTML page caching from stale Next.js builds
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # API proxy: strip /api/ prefix — backend serves at /v1/...
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Don't cache API responses
        add_header Cache-Control "no-store" always;
    }

    # Socket.IO proxy to standalone gateway
    location /socket.io/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Gateway internal broadcast endpoint (restrict by IP if needed)
    location /broadcast {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI health / docs
    location /docs/ {
        proxy_pass http://localhost:8000/docs/;
        proxy_set_header Host $host;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dancingdragonservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dancingdragonservices.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.dancingdragonservices.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = dancingdragonservices.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name dancingdragonservices.com www.dancingdragonservices.com;
    return 404;
}
