server {
    server_name dancingdragonservices.com www.dancingdragonservices.com;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy: strip /api/ prefix — backend serves at /v1/...
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket proxy: PRESERVE /ws/ path — backend expects /ws/venues/{id}/queue
    location /ws/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /docs/ {
        proxy_pass http://localhost:8000/docs/;
        proxy_set_header Host $host;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dancingdragonservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dancingdragonservices.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.dancingdragonservices.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = dancingdragonservices.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name dancingdragonservices.com www.dancingdragonservices.com;
    return 404;
}
