# Sprint 5 Integration Test Environment
# Usage:
#   docker compose -f docker-compose-test.yml up -d --build
#   pytest tests/test_integration_dockerized.py -v --integration
#   docker compose -f docker-compose-test.yml down -v

services:
  test-postgres:
    image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: scales-test-postgres
    environment:
      POSTGRES_USER: scales_test
      POSTGRES_PASSWORD: scales_test
      POSTGRES_DB: scales_test
    ports:
      - "25432:5432"
    volumes:
      - scales_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scales_test -d scales_test"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - scales_test

  test-redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: scales-test-redis
    ports:
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - scales_test

  test-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scales-test-api
    environment:
      APP_NAME: ScalesAPI-Test
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://scales_test:scales_test@test-postgres:5432/scales_test
      REDIS_URL: redis://test-redis:6379/0
      GATEWAY_URL: http://test-gateway:3001
      GATEWAY_INTERNAL_SECRET: test-gateway-secret
      JWT_SECRET_KEY: test-jwt-secret-do-not-use-in-production
      JWT_ALGORITHM: HS256
      DEBUG: "true"
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./scripts/entrypoint.sh:/app/entrypoint.sh:ro
    entrypoint: ["sh", "/app/entrypoint.sh"]
    ports:
      - "28000:8000"
    command:
      - "--workers"
      - "1"
      - "--log-level"
      - "debug"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - scales_test

  test-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: scales-test-gateway
    environment:
      NODE_ENV: test
      GATEWAY_PORT: '3001'
      REDIS_HOST: test-redis
      REDIS_URL: redis://test-redis:6379/0
      LOG_LEVEL: debug
      METRICS_ENABLED: 'true'
      JWT_SECRET_KEY: test-jwt-secret-do-not-use-in-production
      ALLOWED_ORIGINS: '*'
      GATEWAY_INTERNAL_SECRET: test-gateway-secret
    depends_on:
      test-redis:
        condition: service_healthy
    ports:
      - "23001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - scales_test

volumes:
  scales_test_pgdata:
    driver: local

networks:
  scales_test:
    driver: bridge
